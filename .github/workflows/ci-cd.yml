# CI: every push and PR to master runs the full backend suite and the frontend
# type-check. It builds and deploys nothing: production is the VPS
# (docker-compose.vps.yml, deploy loop in CLAUDE.md). The earlier template here
# targeted main/develop (so it never ran), pushed images to GHCR and deployed to
# a Kubernetes cluster this project does not have; replaced 2026-09-23.
name: CI

on:
  push:
    branches: [master]
    paths: ["apps/**", ".github/workflows/ci-cd.yml"]
  pull_request:
    branches: [master]
    paths: ["apps/**", ".github/workflows/ci-cd.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Backend tests (Python 3.11, as prod)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edgp_user
          POSTGRES_PASSWORD: edgp_password
          POSTGRES_DB: edgp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:   # app default redis://localhost:6379 (cache helpers)
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # There is no migration runner: the tests expect a schema built from
      # every migrations/*.sql in order (conftest.py, CLAUDE.md "Migrations").
      - name: Apply migrations
        env:
          PGPASSWORD: edgp_password
        run: |
          for f in migrations/*.sql; do
            psql -q -v ON_ERROR_STOP=1 -h localhost -U edgp_user -d edgp_test -f "$f" > /dev/null
          done

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://edgp_user:edgp_password@localhost:5432/edgp_test
        run: python -m pytest -q -p no:warnings

  web-typecheck:
    name: Frontend type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
