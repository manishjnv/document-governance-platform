<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ page_title }}</title>
<meta name="author" content="{{ brand_name_esc }}">
<meta name="description" content="MITRE ATT&amp;CK coverage assessment for {{ doc_title_esc }}{{ doc_title_suffix }} — overall coverage {{ overall_strict_pct_esc }}%, ATT&amp;CK {{ attack_version_esc }}.">
<meta name="keywords" content="MITRE ATT&amp;CK, coverage assessment, gap analysis, {{ brand_name_esc }}">
<style>
{% include "style.css" %}
</style>
</head>
<body>
{% if brand_watermark_esc %}<div class="watermark">{{ brand_watermark_esc }}</div>{% endif %}
<div class="page-header-brand">{% if logo_data_uri %}<img src="{{ logo_data_uri }}" alt="" class="header-logo">{% endif %}<span class="header-brand-name">{{ brand_name_esc }}</span></div>
<div class="container">
{% block content %}{% endblock %}
</div>
</body></html>
