# Deployment for a SHARED VPS that already runs other projects' containers.
# Distinct from docker-compose.prod.yml (that one assumes a dedicated host
# with standard ports 80/443/5432/6379/3000/8000 -- all in use here by
# other projects). Everything below is isolated: own network, own named
# volumes, own container names (all "scopewise-" prefixed), and only two
# host ports published (9094 web, 9095 api) -- chosen because they were
# free at deploy time (see `ss -tlnp` against the host before adding more).
# No postgres/redis ports are published to the host at all.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scopewise-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - scopewise_postgres_data:/var/lib/postgresql/data
    networks:
      - scopewise-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scopewise-redis
    volumes:
      - scopewise_redis_data:/data
    networks:
      - scopewise-net
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: scopewise-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # Set by the deploy command (GIT_SHA=$(git rev-parse --short HEAD));
      # recorded in every review's audit_meta.
      GIT_SHA: ${GIT_SHA:-unknown}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/uploads
      # MITRE Phase 13b vault master key (32-byte base64; generated into
      # .env at deploy, never committed). Absent => saved connections 503.
      SIEM_CRED_KEY: ${SIEM_CRED_KEY:-}
    volumes:
      - scopewise_uploads:/app/data/uploads
    ports:
      - "9095:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scopewise-net

  # MITRE Phase 13c: Celery worker + in-process beat for scheduled SIEM
  # pulls. Shared-VPS discipline: no published ports, scopewise-net only,
  # hard resource caps (host has several unrelated projects).
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: scopewise-worker
    restart: unless-stopped
    # -s writes beat's schedule DB to a writable path: /app is not writable
    # by appuser, so the default CWD location crashed beat with
    # "_gdbm.error: Permission denied: celerybeat-schedule" and the 15-min
    # sweep never fired (2026-08-02 prod review).
    command: celery -A app.core.celery_app worker -B --loglevel=info --concurrency=2 --schedule=/tmp/celerybeat-schedule
    # Worker-specific healthcheck: the api image's HTTP /health probe never
    # passes here (a worker runs no HTTP server). Ping the worker via Celery.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 45s
      retries: 3
    mem_limit: 512m
    cpus: 0.5
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # deliberately NO JWT_SECRET_KEY / OAuth vars: the worker never
      # verifies tokens — least privilege (adversarial finding #2).
      # SMTP is needed since 13d: scheduled-failure admin notifications.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GIT_SHA: ${GIT_SHA:-unknown}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/uploads
      SIEM_CRED_KEY: ${SIEM_CRED_KEY:-}
    volumes:
      - scopewise_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - scopewise-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
    container_name: scopewise-web
    restart: unless-stopped
    ports:
      - "9094:3000"
    depends_on:
      - api
    networks:
      - scopewise-net

networks:
  scopewise-net:
    name: scopewise-net

volumes:
  scopewise_postgres_data:
    name: scopewise_postgres_data
  scopewise_redis_data:
    name: scopewise_redis_data
  scopewise_uploads:
    name: scopewise_uploads
